spring.application.name=ecoturismo-rio
server.port=8080

# MySQL — banco e usuário criados por db/criar-banco.sql (rode uma vez: sudo mysql < db/criar-banco.sql)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/ecoturismo?serverTimezone=America/Sao_Paulo&characterEncoding=UTF-8}
spring.datasource.username=${DB_USER:ecoturismo}
spring.datasource.password=${DB_PASSWORD:ecoturismo123}
# o esquema é do Flyway (db/migration); o Hibernate só lê e grava, nunca cria ou altera tabelas
spring.jpa.hibernate.ddl-auto=none
# usa os nomes das tabelas e colunas exatamente como nas anotações (idTrilha, dataNascimento...), sem virar snake_case
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
spring.flyway.locations=classpath:db/migration

# JWT — troque o segredo em produção (mínimo 32 caracteres) via variável de ambiente JWT_SECRET
app.jwt.secret=${JWT_SECRET:troque-este-segredo-por-um-valor-longo-e-aleatorio-123456}
app.jwt.expiration-ms=86400000

# Origem do frontend (Vite)
app.cors.allowed-origins=http://localhost:5173,http://localhost:4173
# Endereço do frontend usado nos links enviados por e-mail (recuperação de senha)
app.frontend-url=${FRONTEND_URL:http://localhost:5173}

# Usuário admin criado na inicialização, se ainda não existir
app.admin.email=admin@ecoturismo.rio
app.admin.senha=admin123

# Fotos de perfil: pasta local (relativa a onde o backend roda) e limite de tamanho.
# Se mudar o limite, ajuste a mensagem em GlobalExceptionHandler.
app.uploads.dir=${UPLOADS_DIR:uploads}
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=2MB

# Contas de teste (Pedro, Marina e Lucas) criadas na inicialização — deixe app.teste.email vazio para não criar
app.teste.email=pedrodanielcf@gmail.com
app.teste.senha=senha1234
