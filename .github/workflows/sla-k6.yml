name: Medições de SLA (k6)

on:
  workflow_dispatch:
    inputs:
      medicao:
        description: "Qual medição (1 = sistema como está, 2 = depois das otimizações)"
        type: choice
        options: ["1", "2"]
        default: "1"
      degraus:
        description: "Patamares de usuários simultâneos"
        default: "10,25,50,100,150,200"
      patamar:
        description: "Segundos parado em cada patamar"
        default: "50"

permissions:
  contents: read

jobs:
  sla:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ecoturismo
          MYSQL_USER: ecoturismo
          MYSQL_PASSWORD: ecoturismo123
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=20

    env:
      DEGRAUS: ${{ inputs.degraus }}
      SUBIDA: "10"
      PATAMAR: ${{ inputs.patamar }}
      K6_CSV_TIME_FORMAT: unix_milli

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: grafana/setup-k6-action@v1

      - name: Instalar o matplotlib
        run: pip install matplotlib

      - name: Compilar o backend
        working-directory: backend
        run: ./mvnw -q -DskipTests package

      - name: Subir o backend
        run: |
          mkdir -p sla-saida
          nohup java -jar backend/target/*.jar > sla-saida/backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/api/trilhas > /dev/null && exit 0
            sleep 2
          done
          cat sla-saida/backend.log
          exit 1

      - name: Ambiente
        run: |
          cat > sla-saida/ambiente.json <<EOF
          {
            "origem": "GitHub Actions (${{ runner.os }}, ubuntu-latest)",
            "execucaoUrl": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}",
            "mysql": "MySQL $(docker exec ${{ job.services.mysql.id }} mysql --version | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | head -1) (container mysql:8.0)",
            "degraus": "${DEGRAUS//,/, }",
            "subida": "${SUBIDA}",
            "patamar": "${PATAMAR}"
          }
          EOF
          cat sla-saida/ambiente.json

      - name: Busca no catálogo de trilhas
        run: k6 run --system-tags status,name,scenario,expected_response --out csv=sla-saida/busca-trilhas.csv.gz tests/k6/sla/busca-trilhas.js || true

      - name: Planejar e cancelar visita
        run: k6 run --system-tags status,name,scenario,expected_response --out csv=sla-saida/visitas.csv.gz tests/k6/sla/visitas.js || true

      - name: Login
        run: k6 run --system-tags status,name,scenario,expected_response --out csv=sla-saida/login.csv.gz tests/k6/sla/login.js || true

      - name: Gráficos e página
        run: |
          python tests/k6/sla/graficos.py ${{ inputs.medicao }}
          cat docs/SLA.md >> "$GITHUB_STEP_SUMMARY"

      - name: Página atualizada
        uses: actions/upload-artifact@v4
        with:
          name: sla-pagina
          path: docs/

      - name: Resultados brutos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sla-brutos
          path: sla-saida/
          retention-days: 7
